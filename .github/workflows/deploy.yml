name: Deploy Images to GHCR

on:
  push: 
    branches:
      - master
  workflow_dispatch: 

env:
  IMAGE_NAME: central-api

jobs:
  build-push-store-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: tag
        run: |
          BUILD_DATE=$(date +'%d%m%Y')
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUMBER=${{ github.event.number }}
          else
            PR_NUMBER=0
          fi
          TAG="${BUILD_DATE}-${PR_NUMBER}"
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Authenticate to GitHub Container Registry
        run: echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: 'Build Inventory Image'
        run: |
            docker build --tag ghcr.io/karimdevwm/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}} .
            docker push ghcr.io/karimdevwm/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}

  deploy:
    needs: build-push-store-docker-image
    name: Deploy Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using Ansible
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/projet-mspr-bloc-4
            terraform apply -var="central_api_image=ghcr.io/karimdevwm/${{ env.IMAGE_NAME }}:${{ needs.build-push-store-docker-image.outputs.image_tag }}" -auto-approve